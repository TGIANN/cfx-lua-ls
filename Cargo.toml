[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/TGIANN/cfx-lua-ls"

[workspace.dependencies]
cfx-lua-syntax = { path = "crates/syntax" }
cfx-lua-ide = { path = "crates/ide" }
cfx-lua-fmt = { path = "crates/fmt" }
rowan = "0.15"
# Same major as rowan uses, so no second copy.
rustc-hash = "1"
rayon = "1"
serde_json = "1"
lsp-server = "0.10"
lsp-types = "0.97"
line-index = "0.1"

[profile.release]
debug = "line-tables-only"
