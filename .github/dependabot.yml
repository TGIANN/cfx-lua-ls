# Weekly, one grouped pull request per ecosystem. The `build(deps)` prefix is hidden in
# release-please's changelog, so a dependency bump alone does not cut a release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      npm:
        patterns: ["*"]
