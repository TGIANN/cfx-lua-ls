# Weekly. Minor and patch updates come as one grouped pull request per ecosystem; a major update
# comes on its own, to be checked by hand. @types/vscode follows engines.vscode in package.json
# (vsce refuses a newer one) and @types/node the Node that VS Code version runs (1.91: Node 20),
# so both move only with engines.vscode. The `build(deps)` prefix is hidden in
# release-please's changelog, so a dependency bump alone does not cut a release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/vscode"
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
